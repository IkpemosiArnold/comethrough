    <script>
      // Before the app loads: Opera Mini runs scripts on Opera's servers for only a moment, so
      // a crew or plan link goes to its plain page; everyone else starts waking the server,
      // which naps when nobody has used it for a while (web/src/lib/wake.js picks this up).
      (function () {
        var l = location;
        if (/Opera Mini/i.test(navigator.userAgent) && /^\/c\//.test(l.pathname)) { l.replace('/basic' + l.pathname + l.search); return; }
        if (/[?&]mock=/.test(l.search) || !window.fetch) return;
        try { window.__ctWake = fetch('/api/healthz', { cache: 'no-store' }); window.__ctWake.catch(function () {}); } catch (e) {}
      })();
    </script>
