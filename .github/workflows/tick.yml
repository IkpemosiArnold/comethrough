# The heartbeat. Render's free web service sleeps after 15 minutes and Render cron jobs are
# not free, so GitHub Actions calls POST /api/tick about every 3 hours: it creates due
# rituals, rechecks the weather on outdoor plans and deletes expired ones. The call also wakes
# the service, which can take about a minute, so the workflow wakes it with /healthz first and
# then ticks, with retries. GitHub may run a schedule late or drop it; the tick is
# idempotent, so that is harmless.
#
# Plan windows (docs/DEPLOY.md, "Staying awake"): the server stays awake from 2 hours before
# to 1 hour after each plan's start, but a sleeping server cannot wake itself. So the tick
# answers `wake`, the coming windows, and this workflow keeps them in the Actions cache. It
# runs every 30 minutes: when a window is open (or opens within 30 minutes) it asks /healthz,
# which wakes the server, and the server keeps itself awake to the window's end; otherwise
# it does nothing and costs the server nothing. The full tick still runs only every 3 hours.
#
# Repository settings: secret TICK_SECRET (the same value as on Render) and variable
# COMETHROUGH_URL (for example https://comethrough.ikpemosi.work). COMETHROUGH_API_URL, when
# set (https://comethrough.onrender.com), is used instead, so the heartbeat talks to the web
# service directly rather than through the static site's proxy. Schedules run only on the
# default branch and pause after 60 days without repository activity.
name: tick
on:
  schedule:
    - cron: "7,37 * * * *" # minutes 7 and 37 avoid the top-of-the-hour rush on GitHub's runners
  workflow_dispatch:
    inputs:
      full:
        description: "Run the full tick now"
        type: boolean
        default: true
permissions: {}
concurrency:
  group: tick
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # the Actions cache keeps the wake windows between runs; it needs no token permission
    steps:
      - name: What the last tick said
        uses: actions/cache/restore@v4
        with:
          path: .wake
          key: wake-${{ github.run_id }}
          restore-keys: wake-
      - name: Decide
        id: decide
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
        run: |
          now=$(date -u +%s)
          last=$(cat .wake/last-tick 2>/dev/null || echo 0)
          # the full tick about every 3 hours (a little early is fine: GitHub runs schedules late)
          if [ "$FORCE" = "true" ] || [ $((now - last)) -ge $((170 * 60)) ]; then
            echo "do=tick" >> "$GITHUB_OUTPUT"; echo "full tick (last $(( (now - last) / 60 )) minutes ago)"; exit 0
          fi
          # a plan window that is open, or opens within 30 minutes
          open=$(jq -r --argjson now "$now" '[.[] | select(((.from | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601) - 1800) <= $now and $now < (.to | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601))] | length' .wake/wake.json 2>/dev/null || echo 0)
          if [ "${open:-0}" -gt 0 ]; then
            echo "do=wake" >> "$GITHUB_OUTPUT"; echo "a plan window is open: wake the server"; exit 0
          fi
          echo "do=none" >> "$GITHUB_OUTPUT"; echo "nothing to do: the server sleeps"
      - name: POST /api/tick
        if: steps.decide.outputs.do == 'tick'
        env:
          URL: ${{ vars.COMETHROUGH_API_URL || vars.COMETHROUGH_URL }}
          TICK_SECRET: ${{ secrets.TICK_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$TICK_SECRET" ]; then
            echo "::warning::Set the COMETHROUGH_URL variable and the TICK_SECRET secret in the repository settings."
            exit 0
          fi
          mkdir -p .wake
          # wake the free service first (a cold start takes up to a minute), then tick; the
          # tick itself answers within Cloudflare's 100 s (Overpass gets at most 40 s of it)
          curl --silent --output /dev/null --max-time 90 --retry 2 --retry-delay 10 --retry-all-errors "$URL/healthz" || true
          curl --fail-with-body --silent --show-error \
            --max-time 100 --retry 2 --retry-delay 20 --retry-all-errors \
            -X POST -H "Authorization: Bearer $TICK_SECRET" "$URL/api/tick" > .wake/tick.json
          cat .wake/tick.json; echo
          jq -c '.wake // []' .wake/tick.json > .wake/wake.json
          date -u +%s > .wake/last-tick
          rm .wake/tick.json
          echo "wake windows: $(cat .wake/wake.json)"
      - name: Wake for a plan window
        if: steps.decide.outputs.do == 'wake'
        env:
          URL: ${{ vars.COMETHROUGH_API_URL || vars.COMETHROUGH_URL }}
        run: |
          curl --silent --show-error --max-time 90 --retry 2 --retry-delay 10 --retry-all-errors "$URL/healthz" | jq -c '{ok, store}' || true
      - name: Keep the wake windows for the next runs
        if: steps.decide.outputs.do == 'tick'
        uses: actions/cache/save@v4
        with:
          path: .wake
          key: wake-${{ github.run_id }}
